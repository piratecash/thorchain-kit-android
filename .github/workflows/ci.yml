name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
    # Releases are exact numeric SemVer tags (1.0.0); anything else is not a release.
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :thorchainkit:testDebugUnitTest --console=plain

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :thorchainkit:desktopTest --console=plain

  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -PVERSION_NAME=0.0.0-SNAPSHOT publishToMavenLocal --console=plain
      - run: ./gradlew -p consumer-smoke compileKotlinDesktop compileDebugKotlinAndroid --console=plain

  sample:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :sample-shared:desktopTest :sample-desktop:compileKotlin :sample-android:assembleDebug --console=plain

  # JitPack builds a tag once and never rebuilds it, so it is asked only after every check passed,
  # and the release counts only once the artifacts a consumer resolves are really downloadable.
  jitpack:
    if: github.ref_type == 'tag'
    needs: [android, desktop, publish, sample]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TAG: ${{ github.ref_name }}
      BASE: https://jitpack.io/com/github/piratecash/thorchain-kit-android
    steps:
      - name: Build the tag on JitPack and verify the artifacts
        run: |
          set -eu
          curl -s -o /dev/null --max-time 120 "$BASE/$TAG/build.log" || true
          artifacts="thorchainkit/$TAG/thorchainkit-$TAG.module
          thorchainkit-android/$TAG/thorchainkit-android-$TAG.aar
          thorchainkit-desktop/$TAG/thorchainkit-desktop-$TAG.jar
          thorchainkit-proto/$TAG/thorchainkit-proto-$TAG.jar"
          for attempt in $(seq 1 60); do
            missing=0
            for path in $artifacts; do
              curl -fsI --max-time 60 "$BASE/$path" >/dev/null || missing=$((missing + 1))
            done
            if [ "$missing" -eq 0 ]; then
              echo "JitPack published $TAG"
              exit 0
            fi
            echo "waiting for JitPack: $missing artifact(s) missing (attempt $attempt/60)"
            sleep 30
          done
          echo "JitPack did not publish $TAG; build log:" >&2
          curl -s --max-time 60 "$BASE/$TAG/build.log" | tail -80 >&2
          exit 1
